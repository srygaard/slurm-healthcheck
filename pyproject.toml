[project]
name = "slurm-healthcheck"
version = "0.1.0"
description = "Pre-flight SLURM cluster health check for large multi-node GPU training runs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "nvidia-ml-py>=12.535",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests", "launcher", "healthcheck"]
addopts = "--doctest-modules"
pythonpath = ["."]

[tool.ruff]
line-length = 120
